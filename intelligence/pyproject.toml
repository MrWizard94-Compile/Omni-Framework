# Omni-Framework intelligence pipeline — tooling configuration (ADR-0004).
# Runtime is stdlib-only; pytest/ruff/mypy are dev-only (see requirements-dev.txt).

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # bugbear
    "A",   # builtins shadowing
    "C4",  # comprehensions
    "SIM", # simplify
    "PTH", # pathlib
    "RUF", # ruff-specific
]

[tool.mypy]
strict = true
files = ["tools", "tests"]
mypy_path = "tools"
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]
addopts = "-q"
