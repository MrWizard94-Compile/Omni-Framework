[[features]]
name = "Bundled per-version Java runtimes"
category = "java"
description = "The launcher installs the exact JVM each version declares via runtime manifests."
maturity = "core"
future_proofing = 5
omni_relevance = "adopt"
notes = "The same manifests power Prism's auto-Java (source-verified); Omni does likewise."
source_keys = ["wiki-clientjson", "help-launcher"]

[[features]]
name = "Profiles over shared directory"
category = "instance-model"
description = "Profiles share one .minecraft by default; isolation is manual."
maturity = "core"
future_proofing = 1
omni_relevance = "avoid"
notes = "The founding anti-pattern of this market. Omni is instance-first like the whole third-party corpus."
source_keys = ["wiki-launcher-profiles", "wiki-dotminecraft"]

[[features]]
name = "Ownership-gated play"
category = "auth"
description = "Entitlement verification precedes launch; no unverified play paths."
maturity = "core"
future_proofing = 5
omni_relevance = "adopt"
notes = "The compliance baseline. Omni's offline semantics (cached entitlement window, per the prism dossier note) must stay within it."
source_keys = ["eula", "help-launcher"]

[[features]]
name = "Multi-title hub distribution (Store/MSIX)"
category = "distribution"
description = "One launcher fronts multiple titles, distributed and updated through the Microsoft Store."
maturity = "core"
future_proofing = 3
omni_relevance = "observe"
notes = "Store distribution reduces install friction; worth evaluating for OmniLauncher alongside direct download in Phase 5 release engineering."
source_keys = ["help-launcher"]

[[file_formats]]
name = "launcher_profiles.json"
format_kind = "json"
path_pattern = ".minecraft/launcher_profiles.json"
source_keys = ["wiki-launcher-profiles"]
description = """
Documented profile store: profiles keyed by id (name, type, lastVersionId, gameDir, javaArgs,
icon, timestamps) plus launcher settings. Omni's migration importer reads it to reconstruct
profiles as proper instances."""

[[file_formats]]
name = "client.json (per-version metadata)"
format_kind = "json"
path_pattern = ".minecraft/versions/<id>/<id>.json (served from piston-meta)"
source_keys = ["wiki-clientjson"]
description = """
The per-version contract: mainClass, arguments (rule-gated), libraries (maven coords,
downloads with sha1/size, OS rules, natives classifiers), assetIndex, downloads
(client/server jars), javaVersion component, logging. The single most load-bearing format in
the entire domain — every loader and launcher in this corpus builds on it."""

[[protocols]]
name = "Mojang public metadata + content endpoints"
endpoint = "piston-meta.mojang.com, resources.download.minecraft.net, libraries.minecraft.net, api.minecraftservices.com"
source_keys = ["wiki-version-manifest", "wiki-clientjson", "help-launcher"]
description = """
The complete public surface: version metadata (piston-meta), hashed asset objects
(resources), library artifacts (libraries), and account/entitlement services
(minecraftservices). All consumption is hash-verified and documented; COMPLIANCE.md §1
requires Omni fetch game content only from these official surfaces."""

[[notes]]
title = "ADR-0002 boundary statement"
body = """
This study uses only public documentation and the community-documented public endpoints that
every launcher (including this corpus's open-source subjects) consumes by design. The
launcher binaries themselves were not inspected. The public contract recorded here is
complete for Omni's purposes: the launcher's proprietary internals are irrelevant when the
entire integration surface is public and better documented than most open standards."""
source_keys = ["wiki-clientjson", "help-launcher"]
